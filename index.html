<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FHNW Study</title>
<meta name="description" content="Summaries, flashcards and quizzes for FHNW semester 1.">
<meta name="theme-color" content="#14344f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FHNW Study">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
/* Layout: phone = header + content + bottom tab bar; Mac (≥900px) = left sidebar (views + subjects) + content. Native system type. */
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --panel-2: #eaeef2;
  --ink: #15202b;
  --ink-2: #5a6774;
  --line: #d9dfe5;
  --brand: #14344f;
  --brand-ink: #ffffff;
  --accent: #2c6ea3;
  --good: #1e7a50; --good-bg: #e1f2e9;
  --bad: #b03a34;  --bad-bg: #f8e3e1;
  --warn-bg: #fbf1d9; --warn-ink: #7a5200;
  --s-fin: #2f6fa8; --s-ob: #8a4fa3; --s-ct: #c0602a; --s-math: #2b8a7a; --s-pm: #a83c5a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tabbar-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1419; --panel: #182029; --panel-2: #222c37; --ink: #e7ecf1; --ink-2: #98a5b3; --line: #2c3845;
  --brand: #6fb0e2; --brand-ink: #0b1622; --accent: #6fb0e2;
  --good: #6fd2a1; --good-bg: #163326; --bad: #f19590; --bad-bg: #3a1d1b; --warn-bg: #3a2f14; --warn-ink: #f2cd7a;
  --s-fin: #6ea9dc; --s-ob: #c18fd8; --s-ct: #ee9a67; --s-math: #63c7b5; --s-pm: #e483a0;
  color-scheme: dark; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs, 16px); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 16px; font-weight: 600; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }

/* Shell */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.sidebar { display: none; }
.main { min-width: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.page { max-width: 760px; margin: 0 auto; padding-block: 20px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.page-head { display: grid; gap: 4px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; justify-self: start; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { height: var(--tabbar-h); border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--ink-2); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

@media (min-width: 900px) {
  .app { grid-template-columns: 264px minmax(0, 1fr); height: 100%; }
  .sidebar { display: flex; flex-direction: column; gap: 22px; background: var(--panel); border-right: 1px solid var(--line); padding: 28px 14px; overflow-y: auto; }
  .main { overflow-y: auto; padding-bottom: 40px; }
  .tabbar { display: none; }
  .page { padding-block: 36px 24px; padding-left: 40px; padding-right: 40px; }
  .back { display: none; }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand img { width: 30px; height: 30px; border-radius: 7px; }
.brand b { font-size: 15px; }
.brand span { display: block; font-size: 12px; color: var(--ink-2); }
.nav { display: grid; gap: 2px; }
.nav .label { padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; color: var(--ink-2); }
.nav-item:hover { background: var(--panel-2); }
.nav-item[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
.nav-item[aria-current="page"] svg { color: var(--brand-ink); }
.nav-item .n { margin-left: auto; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nav-item[aria-current="page"] .n { color: inherit; opacity: .8; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--ink-2); padding: 0 10px; }

/* Shared blocks */
.group { background: var(--panel); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 0; background: none; width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .sub { font-size: 13px; color: var(--ink-2); }
.chev { color: var(--ink-2); flex: none; }
.bar { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--accent)); }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 15px; background: var(--panel-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.good { background: var(--good-bg); color: var(--good); }
.btn.bad { background: var(--bad-bg); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 7px 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.starter { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-ink); vertical-align: middle; }
.empty { padding: 20px; border-radius: 14px; border: 1px dashed var(--line); color: var(--ink-2); display: grid; gap: 6px; }
.empty h3 { color: var(--ink); }
.sum-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.img-chip { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--panel-2); border-radius: 999px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
details.sec summary .img-chip + .chev { margin-left: 6px; }
.fig { margin: 4px 0 0; display: grid; gap: 6px; }
.fig-btn { border: 0; padding: 0; background: #fff; border-radius: 10px; overflow: hidden; cursor: zoom-in; display: block; max-width: 100%; justify-self: start; box-shadow: 0 0 0 1px var(--line); }
.fig img { display: block; max-width: 100%; height: auto; max-height: 420px; object-fit: contain; }
.fig figcaption { font-size: 13px; color: var(--ink-2); }
.examples { display: grid; gap: 8px; margin-top: 4px; }
.ex { background: var(--panel-2); border-radius: 10px; padding: 10px 14px; }
.ex summary { cursor: pointer; font-weight: 600; font-size: 15px; }
.ex p { margin: 8px 0 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.5; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,16,.92); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.lightbox img { max-width: 100%; max-height: calc(100vh - 90px); background: #fff; border-radius: 8px; touch-action: pinch-zoom; }
.lightbox p { color: #e7ecf1; font-size: 14px; margin: 10px 0 0; text-align: center; }
.lightbox button { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); border: 0; background: rgba(255,255,255,.15); color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; }

/* Today */
.classes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.class { background: var(--panel); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; border-left: 4px solid var(--c); }
.class time { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border-radius: 14px; padding: 14px 16px; }
.stat b { display: block; font-family: var(--font-round); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { display: block; font-size: 13px; line-height: 1.3; margin-top: 4px; color: var(--ink-2); }
.nav-item[aria-current="page"] .dot { box-shadow: 0 0 0 2px var(--brand-ink); }

/* Summary */
.summary { display: grid; gap: 14px; }
.sec { background: var(--panel); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; }
.sec .src { font-size: 12px; color: var(--ink-2); }
.sec ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.formula { font-family: var(--mono); font-size: 13.5px; background: var(--panel-2); padding: 8px 12px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.terms { display: grid; gap: 4px; font-size: 14px; }
.terms div b { font-weight: 600; }
details.sec summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary .chev { margin-left: auto; transition: transform .2s; }
details.sec[open] summary .chev { transform: rotate(90deg); }

/* Flashcard */
.stage { perspective: 1400px; }
.card { position: relative; width: 100%; min-height: 240px; border: 0; padding: 0; background: none; text-align: left; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); touch-action: pan-y; }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; padding: 24px; display: grid; align-content: center; gap: 12px; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(20,52,79,.08); border-top: 5px solid var(--c); }
.face.back { transform: rotateY(180deg); }
.face .q { font-size: clamp(19px, 4.6vw, 24px); font-weight: 600; line-height: 1.3; }
.face .a { font-size: 17px; white-space: pre-line; }
.face .hint { position: absolute; bottom: 14px; right: 18px; font-size: 12px; color: var(--ink-2); }
.card-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Quiz */
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 12px; padding: 13px 15px; display: flex; gap: 12px; align-items: baseline; font-size: 15.5px; }
.opt .k { font-family: var(--mono); font-size: 13px; color: var(--ink-2); flex: none; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.explain { background: var(--panel); border-radius: 12px; padding: 14px 16px; font-size: 15px; }
.big { font-family: var(--font-round); font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }

.install { background: var(--panel); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.install img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
.install button { margin-left: auto; border: 0; background: none; color: var(--ink-2); font-size: 20px; line-height: 1; padding: 0 4px; }
/* Course info card */
.course { display: grid; gap: 12px; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--c) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line)); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 18px; }
.fact { display: grid; gap: 2px; min-width: 0; font-size: 14.5px; }
.fact .label { font-size: 11px; }
.fact.wide { grid-column: 1 / -1; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; }
.badge.yes { background: var(--good-bg); color: var(--good); }
.badge.no { background: var(--panel-2); color: var(--ink-2); }
.dates { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.dates li { display: grid; grid-template-columns: 86px 1fr; gap: 8px; }
.dates time { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-top: 1px; }
.course ul.imp { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
/* Chapters, highlights, examples, notes, edit, settings */
.toc { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.toc::-webkit-scrollbar { display: none; }
.toc button { flex: none; border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: color-mix(in srgb, var(--c) 9%, var(--panel)); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; }
.chapter { display: grid; gap: 10px; scroll-margin-top: 16px; }
.ch-title { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; border-radius: 12px; border-left: 6px solid var(--c); background: color-mix(in srgb, var(--c) 17%, var(--panel)); color: color-mix(in srgb, var(--c) 70%, var(--ink)); font-size: 1.15em; }
.ch-title .n { font-family: var(--mono); font-size: 12px; opacity: .8; }
.hl { padding: 1px 6px; border-radius: 5px; background: color-mix(in srgb, var(--c) 22%, transparent); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
mark { background: color-mix(in srgb, var(--c) 28%, transparent); color: inherit; padding: 0 3px; border-radius: 3px; font-weight: 600; }
.ex { background: color-mix(in srgb, var(--c) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line)); }
.ex .label { color: color-mix(in srgb, var(--c) 75%, var(--ink)); }
.ex .q { font-weight: 600; margin-top: 2px; }
.ex p { margin: 6px 0 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.5; }
.tag-ed { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--panel-2); color: var(--ink-2); vertical-align: middle; }
.note { background: #fff8d6; border: 1px solid #e9d27a; border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
@media (prefers-color-scheme: dark) { .note { background: #2e2a17; border-color: #6b5d24; } }
.note textarea, .field textarea, .field input { font: inherit; color: var(--ink); width: 100%; border-radius: 8px; }
.note textarea { background: transparent; border: 0; padding: 0; min-height: 52px; resize: vertical; }
.note .top { display: flex; justify-content: space-between; gap: 8px; }
.saved { font-size: 12px; color: var(--ink-2); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; font-size: 14px; justify-self: start; }
.edit-card { background: var(--panel); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field textarea, .field input { background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; }
.field textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.btn.small { padding: 7px 12px; font-size: 14px; }
.info { background: var(--panel); border-radius: 14px; padding: 12px 16px; font-size: 14px; color: var(--ink-2); }
.rules { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.color-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.color-row + .color-row { border-top: 1px solid var(--line); }
.color-row input { width: 44px; height: 32px; border: 0; padding: 0; background: none; }
.color-row .grow { flex: 1; min-width: 0; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } details.sec summary .chev { transition: none; } }
</style>
</head>

<script>
const SUBJECTS = [
  { id: "financial-accounting", name: "Financial Accounting", short: "Fin. Accounting", color: "--s-fin" },
  { id: "organisational-behaviour", name: "Organisational Behaviour", short: "Org. Behaviour", color: "--s-ob" },
  { id: "critical-thinking", name: "Critical Thinking", short: "Critical Thinking", color: "--s-ct" },
  { id: "math", name: "Math", short: "Math", color: "--s-math" },
  { id: "principles-of-management", name: "Principles of Management", short: "Principles of Mgmt", color: "--s-pm" },
];
// Swiss time, weekday 0 = Sunday
const SCHEDULE = {
  1: [["08:00", "12:00", "financial-accounting"], ["13:00", "15:00", "organisational-behaviour"], ["15:30", "19:00", "critical-thinking"]],
  3: [["17:30", "19:00", "math"]],
  4: [["17:30", "21:00", "principles-of-management"]],
};
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const ICONS = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  subjects: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/></svg>',

    const next = { chapter: v("chapter").trim(), heading: v("heading").trim(), points: lines(v("points")), formulas: lines(v("formulas")), source: v("source").trim(),
      examples: lines(v("examples")).map((l) => { const [q, ...a] = l.split("||"); return a.length ? { q: q.trim(), a: a.join("||").trim() } : { q: q.trim() }; }) };
    const was = JSON.stringify([chapterOf(sec), sec.heading || "", sec.points || [], sec.formulas || [], sec.source || "", (sec.examples || []).map((e) => typeof e === "string" ? { q: e } : e)]);
    if (was !== JSON.stringify([next.chapter, next.heading, next.points, next.formulas, next.source, next.examples])) { Object.assign(sec, next); sec.edited = true; delete sec.starter; }
  });
}

function renderSettings() {
  const lk = local(); const rules = (DATA && DATA.settings && DATA.settings.rules && DATA.settings.rules.length) ? DATA.settings.rules : DEFAULT_RULES;
  const srcs = (DATA && DATA.settings && DATA.settings.sources) || {};
  return `<div class="page-head"><span class="label">Your app</span><h1>Settings</h1></div>
    <section style="display:grid;gap:10px"><h2>Text size</h2>
      <div class="seg" role="group" aria-label="Text size">${[["s", "Small"], ["m", "Normal"], ["l", "Large"], ["xl", "Extra large"]].map(([k, l]) => `<button data-fs="${k}" aria-pressed="${(lk.fontSize || "m") === k}">${l}</button>`).join("")}</div></section>
    <section style="display:grid;gap:10px"><h2>Subject colours</h2>
      <div class="group">${SUBJECTS.map((s) => `<label class="color-row"><span class="dot" style="--c:${col(s)}"></span><span class="grow"><b style="font-weight:600">${esc(s.name)}</b>${srcs[s.id] ? `<br><span class="muted" style="font-size:13px">Taken from: ${esc(srcs[s.id])}</span>` : ""}</span><input type="color" data-color="${s.id}" value="${hex(col(s))}" aria-label="${esc(s.name)} colour"></label>`).join("")}</div>
      <div><button class="btn small" data-act="reset-colors">Use the colours from the Claude version</button></div></section>
    <section style="display:grid;gap:10px"><h2>Summary rules</h2>
      <p class="muted" style="margin:0">The automatic updates follow these rules. Change them in the Claude version under “App settings &amp; rules”; this app shows them after the next update.</p>
      <div class="info" style="color:var(--ink)"><ol class="rules">${rules.map((r) => `<li>${rich(r)}</li>`).join("")}</ol></div>
      <a class="btn" style="justify-self:start;text-decoration:none;color:inherit" href="https://claude.ai/artifact/YGMdQ7bj6FeHc77rbKN6HF">Open the Claude version</a></section>
    <section style="display:grid;gap:10px"><h2>Saved on this device</h2>
      <div class="actions"><button class="btn small" data-act="copy-notes">Copy all my notes</button><span class="saved" id="copy-msg"></span></div></section>`;
}
function hex(c) {
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  const m = c.match(/var\((--[\w-]+)\)/); const v = m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : "";
  return /^#[0-9a-f]{6}$/i.test(v) ? v : "#2c6ea3";
}

function scopeChips() {
  return `<div class="chips">${[["all", "All subjects"]].concat(SUBJECTS.map((s) => [s.id, s.short])).map(([id, l]) => `<button class="chip" data-scope="${id}" aria-pressed="${st.scope === id}">${id !== "all" ? `<span class="dot" style="--c:${col(subj(id))}"></span>` : ""}${esc(l)}</button>`).join("")}</div>`;
}

function buildDeck() {
  const k = known();
  let list = cardsIn(st.scope);
  if (st.filter === "review") list = list.filter((c) => !k[c.id]);
  st.deck = shuffle(list); st.deckScope = st.scope; st.i = 0; st.flipped = false;
}
function renderCards() {
  return `<div class="page-head"><span class="label">Spaced review</span><h1>Flashcards</h1></div>${scopeChips()}${cardsBody()}`;
}
function cardsBody() {
  const all = cardsIn(st.scope); const k = known();
  const nKnown = all.filter((c) => k[c.id]).length;
  if (!all.length) return `<div class="empty"><h3>No cards yet</h3></div>`;
  const c = st.deck[st.i];
  const filterSeg = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="seg" style="min-width:220px"><button data-filter="review" aria-pressed="${st.filter === "review"}">To review ${all.length - nKnown}</button><button data-filter="all" aria-pressed="${st.filter === "all"}">All ${all.length}</button></div>
    <button class="btn" data-act="shuffle" style="padding:8px 12px;font-size:14px">Shuffle</button></div>`;
  if (!c) return filterSeg + `<div class="empty"><h3>All caught up</h3><p style="margin:0">You know every card here. Switch to “All” to go through them again.</p><div><button class="btn" data-act="reset">Reset progress for these cards</button></div></div>`;
  const s = subj(c.sid);
  return filterSeg + `
    <div class="stage">
      <button class="card${st.flipped ? " flipped" : ""}" id="card" aria-label="Flip card" style="--c:${col(s)}">
        <div class="face"><span class="label">${esc(s.short)} · ${esc(c.topic || "")} ${c.starter ? '<span class="starter">Starter</span>' : ""}</span><div class="q">${esc(c.q)}</div><span class="hint">Tap to flip</span></div>
        <div class="face back"><span class="label">Answer</span><div class="a">${esc(c.a)}</div></div>
      </button>
    </div>
    <div class="card-nav">
      <button class="btn" data-act="prev" ${st.i === 0 ? "disabled" : ""}>‹ Back</button>
      <span class="muted" style="font-variant-numeric:tabular-nums">${st.i + 1} / ${st.deck.length}</span>
      <button class="btn" data-act="next" ${st.i >= st.deck.length - 1 ? "disabled" : ""}>Skip ›</button>
    </div>
    <div class="judge"><button class="btn bad" data-act="again">Review again</button><button class="btn good" data-act="know">I know this</button></div>`;
}

function newQuiz(scope) { st.quiz = { scope, qs: shuffle(qsIn(scope)).slice(0, 10), i: 0, picked: null, score: 0 }; }
function renderQuiz() {
  return `<div class="page-head"><span class="label">Test yourself</span><h1>Quiz</h1></div>${scopeChips()}${quizBody()}`;
}
function quizBody() {
  const z = st.quiz;
  if (!z || !z.qs.length) return `<div class="empty"><h3>No questions yet</h3></div>`;
  if (z.i >= z.qs.length) {
    const pct = Math.round((z.score / z.qs.length) * 100); const b = best();
    if (z.scope !== "all" && (b[z.scope] === undefined || pct > b[z.scope])) { b[z.scope] = pct; store.set("best", b); }
    return `<div class="sec" style="justify-items:start;gap:12px"><span class="label">Result</span><div class="big">${z.score}/${z.qs.length}</div>
      <p class="muted" style="margin:0">${pct}%${z.scope !== "all" ? ` · best ${best()[z.scope]}%` : ""}. Each round draws up to 10 random questions.</p>
      <button class="btn primary" data-act="new-quiz">New round</button></div>`;
  }
  const q = z.qs[z.i]; const s = subj(q.sid); const answered = z.picked !== null;
  return `<div class="bar" style="--c:${col(s)}"><i style="width:${(z.i / z.qs.length) * 100}%"></i></div>
    <div style="display:grid;gap:6px"><span class="label">${esc(s.short)} · Question ${z.i + 1} of ${z.qs.length} · Score ${z.score} ${q.starter ? '<span class="starter">Starter</span>' : ""}</span><h2 style="font-weight:600">${esc(q.q)}</h2></div>
    <div class="opts">${q.options.map((o, i) => { let c = "opt"; if (answered && i === q.answer) c += " right"; else if (answered && i === z.picked) c += " wrong"; return `<button class="${c}" data-opt="${i}" ${answered ? "disabled" : ""}><span class="k">${"ABCDEF"[i]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
    ${answered ? `<div class="explain"><b>${z.picked === q.answer ? "Correct." : "Not quite."}</b> ${esc(q.explain || "")}</div><div><button class="btn primary" data-act="next-q">${z.i === z.qs.length - 1 ? "See result" : "Next question"}</button></div>` : ""}`;
}

function render() {
  renderChrome();
  if (!DATA) { $("#main").innerHTML = `<div class="page"><div class="empty"><h3>Loading your study material…</h3></div></div>`; return; }
  applyLook();
  const body = { today: renderToday, subjects: renderSubjects, subject: renderSubject, cards: renderCards, quiz: renderQuiz, settings: renderSettings }[st.view]();
  $("#main").innerHTML = `<div class="page">${body}</div>`;
}
const rerender = () => { const y = $("#main").scrollTop, wy = window.scrollY; render(); $("#main").scrollTop = y; window.scrollTo(0, wy); };

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.zoom) {
    const lb = document.createElement("div"); lb.className = "lightbox";
    lb.innerHTML = `<div><img src="${esc(d.zoom)}" alt="${esc(d.cap)}">${d.cap ? `<p>${esc(d.cap)}</p>` : ""}</div><button aria-label="Close">×</button>`;
    lb.addEventListener("click", (ev) => { if (ev.target === lb || ev.target.closest("button")) lb.remove(); });
    document.body.appendChild(lb); return;
  }
  if (d.go) { st.editing = false; if (d.go.startsWith("s-")) st.mode = "summary"; go(d.go); return; }
  if (d.mode) { st.editing = false; st.mode = d.mode; rerender(); return; }
  if (d.jump) { const el = document.getElementById(d.jump); if (el) { el.querySelectorAll("details.sec").forEach((x, i) => { if (i === 0) x.open = true; }); el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); } return; }
  if (d.addnote) { st.openNote = st.subject + d.addnote; rerender(); const ta = document.querySelector(`textarea[data-note="${CSS.escape(d.addnote)}"]`); if (ta) { ta.closest("details").open = true; ta.focus(); } return; }
  if (d.fs) { const lk = local(); lk.fontSize = d.fs; store.set("look", lk); rerender(); return; }
  if (d.move) { readDraft(); const [i, k] = d.move.split(":").map(Number); [st.draft[i], st.draft[i + k]] = [st.draft[i + k], st.draft[i]]; rerender(); return; }
  if (d.del !== undefined) { readDraft(); st.draft.splice(+d.del, 1); rerender(); return; }
  if (d.scope) { st.scope = d.scope; store.set("scope", st.scope); if (st.view === "cards") buildDeck(); else newQuiz(st.scope); rerender(); return; }
  if (d.filter) { st.filter = d.filter; store.set("filter", st.filter); buildDeck(); rerender(); return; }
  if (d.opt !== undefined) { const z = st.quiz; z.picked = +d.opt; if (z.picked === z.qs[z.i].answer) z.score++; rerender(); return; }
  if (t.id === "card") { st.flipped = !st.flipped; t.classList.toggle("flipped", st.flipped); return; }
  switch (d.act) {
    case "review-all": st.scope = "all"; st.filter = "review"; store.set("scope", "all"); store.set("filter", "review"); go("cards"); break;
    case "quiz-all": st.scope = "all"; store.set("scope", "all"); newQuiz("all"); go("quiz"); break;
    case "toggle-all": {
      const all = [...document.querySelectorAll("details.sec")];
      const open = !all.every((x) => x.open);
      all.forEach((x) => { x.open = open; });
      t.textContent = open ? "Collapse all" : "Expand all"; break;
    }
    case "edit": st.draft = JSON.parse(JSON.stringify(summaryOf(st.subject))); st.editing = true; rerender(); break;
    case "edit-cancel": st.editing = false; st.draft = null; rerender(); break;
    case "edit-add": { readDraft(); const last = st.draft[st.draft.length - 1]; st.draft.push({ chapter: last ? chapterOf(last) : "", heading: "", points: [], source: "", edited: true }); rerender(); break; }
    case "edit-save": {
      readDraft();
      const clean = st.draft.filter((x) => (x.heading || "").trim() || (x.points || []).length);
      const all = store.get("edits", {}); all[st.subject] = { summary: clean, base: sdata(st.subject).updatedAt, at: new Date().toISOString() }; store.set("edits", all);
      st.editing = false; st.draft = null; rerender(); break;
    }
    case "drop-edits": { const all = store.get("edits", {}); delete all[st.subject]; store.set("edits", all); rerender(); break; }
    case "reset-colors": { const lk = local(); delete lk.colors; store.set("look", lk); rerender(); break; }
    case "copy-notes": {
      const all = store.get("notes", {});
      const txt = SUBJECTS.map((s) => { const n = all[s.id]; if (!n) return ""; const parts = [n.general ? n.general : "", ...Object.entries(n.sections || {}).filter(([, v]) => v && v.trim()).map(([k, v]) => `- ${k}: ${v}`)].filter(Boolean); return parts.length ? `${s.name}\n${parts.join("\n")}` : ""; }).filter(Boolean).join("\n\n");
      const msg = $("#copy-msg");
      if (!txt) { msg.textContent = "No notes yet"; break; }
      navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Copied"; }, () => { msg.textContent = "Copy didn't work in this browser"; });
      break;
    }
    case "hide-install": store.set("hideInstall", true); rerender(); break;
    case "shuffle": buildDeck(); rerender(); break;
    case "prev": st.i = Math.max(0, st.i - 1); st.flipped = false; rerender(); break;
    case "next": st.i = Math.min(st.deck.length - 1, st.i + 1); st.flipped = false; rerender(); break;
    case "know": case "again": {
      const c = st.deck[st.i]; const k = known();
      if (c) { if (d.act === "know") k[c.id] = 1; else delete k[c.id]; store.set("known", k); }
      if (d.act === "know" && st.filter === "review") st.deck.splice(st.i, 1); else st.i++;
      if (st.i >= st.deck.length) st.i = Math.max(0, st.deck.length - (d.act === "again" ? 0 : 1));
      if (d.act === "again" && st.i >= st.deck.length) { st.deck = shuffle(st.deck); st.i = 0; }
      st.flipped = false; rerender(); break;
    }
    case "reset": { const k = known(); cardsIn(st.scope).forEach((c) => delete k[c.id]); store.set("known", k); buildDeck(); rerender(); break; }
    case "next-q": st.quiz.i++; st.quiz.picked = null; rerender(); break;
    case "new-quiz": newQuiz(st.quiz.scope); rerender(); break;
  }
});
document.addEventListener("keydown", (e) => {
  const inCards = st.view === "cards" || (st.view === "subject" && st.mode === "cards");
  if (!inCards || e.metaKey || e.ctrlKey) return;
  if (e.key === " ") { e.preventDefault(); $("#card")?.click(); }
  else if (e.key === "ArrowRight") document.querySelector('[data-act="next"]')?.click();
  else if (e.key === "ArrowLeft") document.querySelector('[data-act="prev"]')?.click();
  else if (e.key === "1") document.querySelector('[data-act="again"]')?.click();
  else if (e.key === "2") document.querySelector('[data-act="know"]')?.click();
});
// Swipe on a card: left = review again, right = I know this
let sx = null;
document.addEventListener("touchstart", (e) => { if (e.target.closest("#card")) sx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 70) document.querySelector(`[data-act="${dx > 0 ? "know" : "again"}"]`)?.click();
}, { passive: true });
const noteTimers = {};
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.note !== undefined && st.subject) {
    const key = t.dataset.note; const tag = document.getElementById("saved-" + key); if (tag) tag.textContent = "Saving…";
    clearTimeout(noteTimers[key]); noteTimers[key] = setTimeout(() => { setNote(st.subject, key, t.value); if (tag) tag.textContent = "Saved on this device"; }, 500);
  }
  if (t.dataset.color) { const lk = local(); lk.colors = { ...(lk.colors || {}), [t.dataset.color]: t.value }; store.set("look", lk); const dot = t.closest(".color-row")?.querySelector(".dot"); if (dot) dot.style.setProperty("--c", t.value); renderChrome(); }
});
window.addEventListener("hashchange", route);

/* ---------- boot ---------- */
async function load() {
  try {
    const r = await fetch("data.json", { cache: "no-cache" });
    const fresh = await r.json();
    if (DATA && fresh.generatedAt === DATA.generatedAt) return;
    const first = !DATA; DATA = fresh;
    if (!first) { const a = document.activeElement; if (st.editing || (a && a.tagName === "TEXTAREA")) return; rerender(); return; }
  } catch (e) {
    if (DATA) return;
    $("#main").innerHTML = `<div class="page"><div class="empty"><h3>Can't load your study material</h3><p style="margin:0">Check your connection and open the app again.</p></div></div>`;
    return;
  }
  route();
}
render();
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && DATA) load(); });
</script>
</body>
</html>
